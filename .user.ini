; Sobrepõe os limites padrão do php.ini só para este diretório (funciona com
; PHP-FPM/CGI — a forma mais comum em hospedagem compartilhada; ignorado sem
; erro se o SAPI for mod_php, nesse caso ajuste php.ini/.htaccess manualmente).
; Sem isso, uploads acima de 8MB (padrão do PHP) são rejeitados antes mesmo
; de chegar em upload.php — confirmado em teste local com o lote real (~13MB).
upload_max_filesize = 25M
post_max_size = 30M
max_execution_time = 300
